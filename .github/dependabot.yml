version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      timezone: "Australia/Sydney"
      time: "10:00"
    groups:
      composer-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    cooldown:
      default-days: 2
